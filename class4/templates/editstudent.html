<!DOCTYPE html>
<html lang="en">    
    <head>
        <title>Edit Info</title>
    </head>
    <body>

        <h2>Edit Student: {{ student.name }}</h2>

        <form action="" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" value="{{ student.name }}" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="{{ student.email }}" required><br><br>

            <label for="roll_number">Roll Number:</label>
            <input type="text" id="roll_number" name="roll_number" value="{{ student.roll_number }}" required><br><br>

            <label for="image">Image:</label>
            {% if student.image %}
                <img src="{{ student.image.url }}" alt="Student Image" width="100"><br>
            {% endif %}
            <input type="file" id="image" name="image"><br><br>

            <input type="submit" value="Update Student">
        </form>
        <br
        <a href="{% url 'home' %}">Back to Home</a>

    </body>
</html>
